name: License Scanning for Maven

on:
  workflow_dispatch:
  push:
    branches:
      - 6.x.x
    paths:
      - '**/pom.xml'
      - '.github/license-scanning/**'
      - '.github/workflows/license-scanning.yml'
  pull_request:
    paths:
      - '**/pom.xml'
      - '.github/license-scanning/**'
      - '.github/workflows/license-scanning.yml'

env:
  REPORT_PATH: "target/generated-resources/licenses.xml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21 for x64
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        architecture: x64
        cache: maven
    # Install first so the report resolves the modules' freshly built jars
    # instead of falling back to (expired) snapshots on Sonatype.
    - name: Build
      run: mvn -B clean install -DskipTests
    - name: License XML report
      run: >
        mvn -B org.codehaus.mojo:license-maven-plugin:2.7.1:aggregate-download-licenses
        -DlicensesConfigFile=.github/license-scanning/license-overrides.xml
        -Dlicense.excludedGroups=org.finos.cdm
    - name: Validate XML report
      run: python3 .github/license-scanning/check_licenses.py ${{ env.REPORT_PATH }} .github/license-scanning/allowed-licenses.txt
    - name: Upload license reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: license-reports
        path: target/generated-resources/
